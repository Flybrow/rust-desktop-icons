name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  e2e:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build --locked --bins --examples
      - name: Keep files on the desktop (real desktop)
        run: target/debug/examples/keep_e2e.exe
      - name: Unroll direction (real desktop)
        run: target/debug/examples/unroll_e2e.exe
      - name: System icons (real desktop)
        run: target/debug/examples/system_e2e.exe
