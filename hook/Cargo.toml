[package]
name = "rdi-hook"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Variant"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
